spring:
  application:
    name: output_backend
  profiles:
    default: local
  config:
    import: optional:file:.env[.properties]
  # JWT resource-server auto-config waits for Phase 3 JwtDecoder.
  autoconfigure:
    exclude:
      - org.springframework.boot.security.oauth2.server.resource.autoconfigure.servlet.OAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.security.oauth2.server.resource.autoconfigure.OAuth2ResourceServerAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  # Provider beans wired explicitly in later phases.
  ai:
    model:
      chat: none
      embedding: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      init:
        pull-model-strategy: never
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:qwen3.5:4b}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:bge-m3:latest}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
        embedding:
          options:
            model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}

server:
  port: ${SERVER_PORT:8090}
  address: 0.0.0.0

app:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8080}
    audience: ${JWT_AUDIENCE:auth-api}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:./keys/public.pem}
  embedding:
    default-provider: ${EMBEDDING_PROVIDER:ollama}
    dimensions: ${EMBEDDING_DIMENSIONS:1024}
  llm:
    default-provider: ${LLM_PROVIDER:ollama}
  rag:
    top-k: ${RAG_TOP_K:5}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.70}
  redis-cache:
    query-embedding-ttl-seconds: ${REDIS_QUERY_EMBEDDING_TTL:7200}
    retrieval-ttl-seconds: ${REDIS_RETRIEVAL_TTL:900}
    answer-ttl-seconds: ${REDIS_ANSWER_TTL:3600}
    answer-cache-enabled: ${REDIS_ANSWER_CACHE_ENABLED:false}
  cors:
    allowed-origins:
      - ${CORS_ORIGIN:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.output_backend: INFO
